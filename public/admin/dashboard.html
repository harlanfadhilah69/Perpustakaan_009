<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LibraryAPI</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background-color: #f8fafc; color: #334155; }
        
        nav { 
            background: white; 
            border-bottom: 1px solid #e2e8f0; 
            padding: 15px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        nav strong { color: #1e293b; font-size: 1.4rem; }
        nav a { text-decoration: none; color: #64748b; margin-left: 20px; font-weight: 600; font-size: 14px; }
        nav a:hover { color: #10b981; }

    .container { 
        max-width: 1000px; 
        margin: 40px auto; 
        padding: 0 20px; 
        box-sizing: border-box;
    }        
        .welcome-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .welcome-card h1 { color: #10b981; margin: 0; font-size: 2rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .stat-card h3 { color: #64748b; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .stat-card p { font-size: 2.5rem; font-weight: 800; color: #1e293b; margin: 0; }

        .quick-actions { margin-top: 40px; background: white; padding: 30px; border-radius: 16px; border: 1px solid #e2e8f0; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        button { padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: none; }
        .btn-primary { background: #1e293b; color: white; }
        .btn-primary:hover { background: #334155; transform: translateY(-2px); }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
    </style>
</head>
<body>
    <nav>
        <div><strong>LibraryAPI</strong> | Admin Panel</div>
        <div>
            <a href="/admin/dashboard.html" style="color: #10b981;">Dashboard</a>
            <a href="/admin/kelola-buku.html">Kelola Buku</a>
            <a href="/admin/kelola-user.html">Kelola User</a>
            <a href="/admin/laporan.html">Laporan</a>
            <a href="/" onclick="localStorage.clear()" style="color: #ef4444;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <h1>Selamat Datang, Admin</h1>
            <p>Pantau performa perpustakaan dan kelola data inventaris secara real-time.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Koleksi Buku</h3>
                <p id="totalBuku">0</p>
            </div>
            <div class="stat-card">
                <h3>Peminjaman Aktif</h3>
                <p id="totalPinjam" style="color: #10b981;">0</p>
            </div>
        </div>

        <div class="quick-actions">
            <h2 style="margin-top: 0; color: #1e293b;">Aksi Cepat</h2>
            <p style="color: #64748b;">Akses fitur manajemen utama dengan satu klik.</p>
            <div class="btn-group">
                <button class="btn-primary" onclick="window.location.href='/admin/kelola-buku.html'">Manajemen Buku</button>
                <button class="btn-success" onclick="window.location.href='/admin/laporan.html'">Laporan Transaksi</button>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        async function loadStats() {
            try {
                // Tambahkan API Key di headers agar data bisa ditarik
                const resBooks = await fetch('/books', { headers: { 'x-api-key': user.apiKey } });
                const books = await resBooks.json();
                document.getElementById('totalBuku').innerText = books.length;

                const resLoans = await fetch('/reports/api/daily', { headers: { 'x-api-key': user.apiKey } });
                const loans = await resLoans.json();
                const activeLoans = loans.filter(l => l.status === 'Dipinjam').length;
                document.getElementById('totalPinjam').innerText = activeLoans;
            } catch (err) {
                console.error("Gagal memuat statistik:", err);
            }
        }
        loadStats();
    </script>
</body>
</html>
