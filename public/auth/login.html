<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LibraryAPI Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Desain Senada dengan Index.html (Modern & Minimalist) */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc; /* Latar belakang abu-abu sangat terang */
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Card Styling */
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
            border: 1px solid #e2e8f0;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #1e293b; /* Slate 800 */
            font-size: 1.8rem;
            font-weight: 800;
        }

        .login-card p.subtitle {
            text-align: center;
            color: #64748b; /* Slate 500 */
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Form Styling */
        label {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box; /* Memastikan padding tidak merusak lebar */
        }

        input:focus {
            outline: none;
            border-color: #10b981; /* Emerald 500 */
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        /* Button Styling (Sama dengan btn-main di index.html) */
        button.btn-login {
            width: 100%;
            background: #10b981; 
            color: white; 
            padding: 14px; 
            border: none;
            border-radius: 10px; 
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button.btn-login:hover {
            background: #059669; /* Emerald 600 */
            transform: translateY(-2px);
        }

        button.btn-login:active {
            transform: translateY(0);
        }

        /* Footer Link */
        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
        }

        .footer-text a {
            color: #10b981;
            text-decoration: none;
            font-weight: 700;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login Portal</h2>
        <p class="subtitle">Masuk untuk mengelola API Key Anda.</p>
        
        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="nama@email.com" required>
            
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
            
            <button type="submit" class="btn-login">Masuk Sekarang</button>
        </form>
        
        <p class="footer-text">
            Belum punya akun? <a href="/auth/register.html">Daftar API Key</a>
        </p>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
